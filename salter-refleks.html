<title>Şalter Refleks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Rubik:wght@400;500&display=swap">
<style>
/* Layout: tek ekran oyun. Üstte skor, ortada dev şalter alanı, altta oyuncu satırı. Bilinçli olarak tek (koyu) tema. */
:root {
  --bg: #0e1013;
  --panel: #191c21;
  --ink: #f1f2f4;
  --muted: #8b919c;
  --volt: #ffd21f;
  --red: #ff4d3d;
  --green: #35d07f;
  --f-display: "Chakra Petch", "Arial Narrow", sans-serif;
  --f-ui: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); margin: 0; overflow: hidden; user-select: none; -webkit-user-select: none; }
.app { height: 100%; display: flex; flex-direction: column; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 14px; max-width: 560px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h1 { font: 700 1.5rem var(--f-display); margin: 0; letter-spacing: .02em; }
h1 span { color: var(--volt); }
.round { font: 500 .85rem var(--f-display); color: var(--muted); }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl { background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 8px 10px; min-width: 0; }
.pl.on { border-color: var(--volt); }
.pl input { width: 100%; background: transparent; border: 0; color: var(--ink); font: 500 1rem var(--f-ui); padding: 0; }
.pl input:focus-visible { outline: 1px dashed var(--volt); }
.pl .sc { font: 700 1.3rem var(--f-display); font-variant-numeric: tabular-nums; }
.pl .sc small { font-size: .75rem; color: var(--muted); font-weight: 500; }
.dots { display: flex; gap: 4px; margin-top: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #2c3038; }
.dots i.d { background: var(--volt); }
#pad { flex: 1; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; padding: 20px; cursor: pointer; touch-action: manipulation; background: var(--panel); border: 2px solid #2a2e36; transition: background .06s; position: relative; overflow: hidden; }
#pad:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }
#pad.wait { background: #2a0f0d; border-color: var(--red); }
#pad.go { background: var(--volt); border-color: var(--volt); color: #111; }
#pad.early { background: #3a1410; border-color: var(--red); }
.big { font: 700 clamp(2.4rem, 13vw, 4.2rem)/1 var(--f-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.msg { font-size: 1rem; max-width: 30ch; color: inherit; opacity: .85; line-height: 1.4; }
.lever { width: 64px; height: 110px; border-radius: 10px; background: #0b0c0f; border: 3px solid #3a3f49; position: relative; }
.lever::after { content: ""; position: absolute; left: 8px; right: 8px; height: 44px; border-radius: 6px; background: #c9ccd2; top: 54px; transition: top .08s; }
#pad.go .lever { border-color: #111; } #pad.go .lever::after { top: 8px; background: #111; }
.foot { display: flex; gap: 8px; }
.foot button { flex: 1; font: 500 .9rem var(--f-ui); color: var(--ink); background: var(--panel); border: 1px solid #2c3038; border-radius: 10px; padding: 10px; cursor: pointer; }
.foot button:focus-visible { outline: 2px solid var(--volt); }
.verdict { font: 700 1.4rem var(--f-display); color: var(--volt); }
</style>

<div class="app">
  <header><h1>Şalter <span>Refleks</span></h1><div class="round" id="round">Tur 1 / 5</div></header>
  <div class="players">
    <div class="pl on" id="p0"><input id="n0" value="Sen" aria-label="1. oyuncunun adı"><div class="sc" id="s0">— <small>ms</small></div><div class="dots" id="d0"></div></div>
    <div class="pl" id="p1"><input id="n1" value="Mustafa" aria-label="2. oyuncunun adı"><div class="sc" id="s1">— <small>ms</small></div><div class="dots" id="d1"></div></div>
  </div>
  <div id="pad" role="button" tabindex="0" aria-live="polite">
    <div class="lever" aria-hidden="true"></div>
    <div class="big" id="big">HAZIR</div>
    <div class="msg" id="msg">Ekran <b>SARI</b> olunca şalteri kaldırır gibi hemen dokun. Kırmızıdayken dokunursan kaçak akım rölesi atar! Başlamak için dokun.</div>
  </div>
  <div class="foot">
    <button id="mode">2 oyuncu: Açık</button>
    <button id="reset">Baştan başla</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id), pad = $('pad'), ROUNDS = 5;
  let two = true, cur = 0, state = 'idle', t0 = 0, timer = null, ac = null;
  let times = [[], []];

  const beep = (f, d = .08) => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) {} };
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  const name = i => $('n' + i).value.trim() || (i ? '2. oyuncu' : '1. oyuncu');
  const verdict = ms => ms < 260 ? ['ŞİMŞEK ⚡', 'Uyku mu? Hangi uyku!'] : ms < 330 ? ['TAM AYIK', 'Refleksler yerinde.'] : ms < 430 ? ['YARI UYKULU', 'Bir kahve iyi gider.'] : ['UYUYOR 😴', 'Şalter seni beklerken sen rüyadaydın.'];

  function paint() {
    [0, 1].forEach(i => {
      $('p' + i).hidden = i === 1 && !two;
      $('p' + i).classList.toggle('on', i === cur);
      const a = avg(times[i]); $('s' + i).innerHTML = (a ?? '—') + ' <small>ms ort.</small>';
      $('d' + i).innerHTML = Array.from({ length: ROUNDS }, (_, k) => `<i class="${k < times[i].length ? 'd' : ''}"></i>`).join('');
    });
    $('round').textContent = `Tur ${Math.min(ROUNDS, times[cur].length + 1)} / ${ROUNDS}`;
    $('mode').textContent = '2 oyuncu: ' + (two ? 'Açık' : 'Kapalı');
  }
  function show(cls, big, msg) { pad.className = cls; $('big').textContent = big; $('msg').innerHTML = msg; }

  function arm() {
    state = 'wait'; show('wait', 'BEKLE…', `${name(cur)}, sarıyı bekle.`);
    timer = setTimeout(() => { state = 'go'; t0 = performance.now(); show('go', 'ŞİMDİ!', ''); beep(880); }, 1300 + Math.random() * 2700);
  }
  function done() { return times[0].length >= ROUNDS && (!two || times[1].length >= ROUNDS); }
  function finish() {
    state = 'over';
    if (!two) { const a = avg(times[0]), [v, m] = verdict(a); show('', a + ' ms', `<span class="verdict">${v}</span><br>${m}<br><br>Tekrar oynamak için dokun.`); return; }
    const a = avg(times[0]), b = avg(times[1]), w = a === b ? -1 : a < b ? 0 : 1;
    const head = w < 0 ? 'BERABERE!' : name(w).toUpperCase() + ' KAZANDI';
    show('', head, `${name(0)}: <b>${a} ms</b> · ${verdict(a)[0]}<br>${name(1)}: <b>${b} ms</b> · ${verdict(b)[0]}<br><br>${w < 0 ? 'Rövanş şart.' : `Fark ${Math.abs(a - b)} ms.`} Rövanş için dokun.`);
  }

  function tap(e) {
    if (e) e.preventDefault();
    if (state === 'idle' || state === 'result') return arm();
    if (state === 'over') { times = [[], []]; cur = 0; paint(); return arm(); }
    if (state === 'wait') {
      clearTimeout(timer); state = 'result'; beep(140, .25);
      show('early', 'ERKEN!', 'Kaçak akım rölesi attı ⚠️ Bu tur sayılmadı. Tekrar denemek için dokun.'); return;
    }
    if (state === 'go') {
      const ms = Math.round(performance.now() - t0); times[cur].push(ms); beep(1320, .05);
      const [v] = verdict(ms);
      if (done()) { paint(); return finish(); }
      const nxt = two ? (cur === 0 && times[1].length < ROUNDS ? 1 : cur === 1 && times[0].length < ROUNDS ? 0 : cur) : 0;
      state = 'result'; show('', ms + ' ms', `${v}<br><br>${two && nxt !== cur ? `Sıra <b>${name(nxt)}</b>'da. Telefonu ver, dokununca başlar.` : 'Sonraki tur için dokun.'}`);
      cur = nxt; paint();
    }
  }
  pad.addEventListener('pointerdown', tap);
  pad.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(e); });
  $('mode').addEventListener('click', () => { two = !two; $('reset').click(); });
  $('reset').addEventListener('click', () => { clearTimeout(timer); times = [[], []]; cur = 0; state = 'idle'; paint(); show('', 'HAZIR', 'Ekran <b>SARI</b> olunca hemen dokun. Başlamak için dokun.'); });
  ['n0', 'n1'].forEach(id => $(id).addEventListener('input', paint));
  paint();
})();
</script>
