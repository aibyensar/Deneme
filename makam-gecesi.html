<title>Makam Gecesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Outfit:wght@400;500&display=swap">
<style>
/* Layout: tam ekran gece tuvali; üstte isim, altta makam seçici. Tek görünüm, bilinçli olarak koyu. */
:root {
  --night: #0b0a1a;
  --ink: #efe6d2;
  --muted: #9b93b4;
  --gold: #e8b65a;
  --chip: rgba(255,255,255,.07);
  --f-display: "Cormorant Garamond", Georgia, serif;
  --f-ui: "Outfit", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--f-ui); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.top { position: fixed; top: 0; left: 0; right: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; text-align: center; }
h1 { font: italic 600 2.2rem/1 var(--f-display); margin: 0; letter-spacing: .01em; }
.sub { font-size: .8rem; color: var(--muted); margin-top: 6px; letter-spacing: .04em; min-height: 1.2em; }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.makams { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
button { font: 500 .85rem var(--f-ui); color: var(--ink); background: var(--chip); border: 1px solid rgba(255,255,255,.12); border-radius: 99px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
button[aria-pressed="true"] { background: var(--gold); color: var(--night); border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#auto { font-size: .8rem; }
.start { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(232,182,90,.10), transparent 60%); }
.start button { font: italic 600 1.5rem var(--f-display); padding: 16px 30px; background: transparent; border-color: var(--gold); color: var(--gold); }
.start p { color: var(--muted); font-size: .85rem; text-align: center; margin: 14px 24px 0; max-width: 32ch; line-height: 1.5; }
@media (prefers-reduced-motion: no-preference) { .start button { animation: breathe 2.6s ease-in-out infinite; } }
@keyframes breathe { 50% { box-shadow: 0 0 40px rgba(232,182,90,.35); } }
</style>

<canvas id="c"></canvas>
<div class="top">
  <h1>Makam Gecesi</h1>
  <div class="sub" id="sub">Hicaz · D perdesinden</div>
</div>
<div class="bottom">
  <div class="makams" id="makams" role="group" aria-label="Makam">
    <button aria-pressed="true" data-m="hicaz">Hicaz</button>
    <button aria-pressed="false" data-m="rast">Rast</button>
    <button aria-pressed="false" data-m="ussak">Uşşak</button>
    <button aria-pressed="false" data-m="kurdi">Kürdi</button>
  </div>
  <button id="auto" aria-pressed="false">Kendi kendine çalsın</button>
</div>
<div class="start" id="start">
  <div style="display:flex;flex-direction:column;align-items:center">
    <button id="go">Dokun ve başla</button>
    <p>Sesi aç. Ekrana dokun ya da parmağını kaydır: yukarısı ince, aşağısı kalın perdeler. Kanun gibi tellerin üstünden geçir.</p>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), cx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  addEventListener('resize', resize); resize();

  // Makamlar: perde aralıkları cent cinsinden (koma inceliği yaklaşık; Batı tampere sisteminde olmayan sesler)
  const MAKAM = {
    hicaz: { root: 293.66, name: 'Hicaz · D perdesinden', c: [0, 114, 384, 498, 702, 792, 996], hue: 32 },
    rast:  { root: 196.00, name: 'Rast · G perdesinden', c: [0, 204, 384, 498, 702, 906, 1086], hue: 200 },
    ussak: { root: 293.66, name: 'Uşşak · D perdesinden', c: [0, 182, 294, 498, 702, 792, 996], hue: 280 },
    kurdi: { root: 220.00, name: 'Kürdi · A perdesinden', c: [0, 90, 294, 498, 702, 792, 996], hue: 160 }
  };
  let mk = MAKAM.hicaz;
  const STEPS = 15; // iki oktav + karar
  const freqOf = i => { const o = Math.floor(i / 7), d = i % 7; return mk.root * 0.5 * Math.pow(2, o + mk.c[d] / 1200); };

  // ---------- Ses ----------
  let ac, master, wet, droneNodes = null;
  function initAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.7;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master.connect(comp).connect(ac.destination);
    // Yapay yankı: gürültüden üretilmiş dürtü yanıtı
    const len = ac.sampleRate * 3.2, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const conv = ac.createConvolver(); conv.buffer = ir;
    wet = ac.createGain(); wet.gain.value = 0.55;
    wet.connect(conv).connect(master);
  }
  function pluck(f, pan) {
    const t = ac.currentTime;
    const g = ac.createGain(), flt = ac.createBiquadFilter(), p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    flt.type = 'lowpass'; flt.Q.value = 2;
    flt.frequency.setValueAtTime(Math.min(9000, f * 9), t); flt.frequency.exponentialRampToValueAtTime(Math.max(200, f * 1.5), t + 0.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    [[ 'sawtooth', 1, 0.5 ], [ 'triangle', 1.003, 0.8 ], [ 'sine', 2, 0.25 ]].forEach(([type, mul, lv]) => {
      const o = ac.createOscillator(), og = ac.createGain(); o.type = type; o.frequency.value = f * mul; og.gain.value = lv;
      o.connect(og).connect(flt); o.start(t); o.stop(t + 2.5);
    });
    let out = flt.connect(g);
    if (p) { p.pan.value = pan; out = g.connect(p); }
    out.connect(master); out.connect(wet);
  }
  function drone(on) {
    if (droneNodes) { const t = ac.currentTime; droneNodes.g.gain.setTargetAtTime(0, t, 0.6); const n = droneNodes; setTimeout(() => n.oscs.forEach(o => o.stop()), 3000); droneNodes = null; }
    if (!on) return;
    const t = ac.currentTime, g = ac.createGain(), flt = ac.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 700;
    g.gain.value = 0; g.gain.setTargetAtTime(0.09, t, 1.2);
    const oscs = [mk.root * 0.5, mk.root * 0.5 * 1.004, mk.root * 0.75].map((f, i) => { const o = ac.createOscillator(); o.type = i === 2 ? 'sine' : 'triangle'; o.frequency.value = f; o.connect(flt); o.start(); return o; });
    flt.connect(g); g.connect(master); g.connect(wet);
    droneNodes = { g, oscs };
  }

  // ---------- Görüntü ----------
  const stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.2, tw: Math.random() * 6.28 }));
  const ripples = [], sparks = [], nodes = [];
  const bandY = i => H * (0.86 - 0.70 * i / (STEPS - 1));
  function play(i, x) {
    const f = freqOf(i), y = bandY(i), hue = mk.hue + i * 9;
    if (ac) pluck(f, Math.max(-0.9, Math.min(0.9, (x / W) * 2 - 1)));
    ripples.push({ x, y, r: 4, a: 1, hue });
    for (let k = 0; k < 14; k++) { const ang = Math.random() * 6.28, sp = 0.6 + Math.random() * 2.4; sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6, a: 1, hue }); }
    nodes.push({ x, y, a: 1, hue }); if (nodes.length > 40) nodes.shift();
    lit[i] = 1;
  }
  const lit = new Array(STEPS).fill(0);
  const idxAt = y => Math.max(0, Math.min(STEPS - 1, Math.round((0.86 - y / H) / 0.70 * (STEPS - 1))));

  let tm = 0;
  function frame() {
    tm += 0.016;
    cx.fillStyle = 'rgba(11,10,26,0.28)'; cx.fillRect(0, 0, W, H);
    // yıldızlar
    for (const s of stars) { const a = 0.35 + 0.35 * Math.sin(tm * 1.3 + s.tw); cx.fillStyle = `rgba(239,230,210,${a})`; cx.beginPath(); cx.arc(s.x * W, s.y * H, s.r, 0, 6.28); cx.fill(); }
    // perde telleri
    for (let i = 0; i < STEPS; i++) {
      const y = bandY(i), l = lit[i]; lit[i] *= 0.93;
      const wob = l * 5 * Math.sin(tm * 60 + i);
      cx.strokeStyle = `hsla(${mk.hue + i * 9},70%,${55 + l * 25}%,${0.10 + l * 0.7})`;
      cx.lineWidth = i % 7 === 0 ? 1.6 : 0.8;
      cx.beginPath(); cx.moveTo(0, y); cx.quadraticCurveTo(W / 2, y + wob, W, y); cx.stroke();
    }
    // takımyıldız çizgileri
    cx.lineWidth = 0.7;
    for (let i = 1; i < nodes.length; i++) { const a = nodes[i - 1], b = nodes[i]; const al = Math.min(a.a, b.a) * 0.5; if (al < 0.02) continue; cx.strokeStyle = `hsla(${b.hue},80%,75%,${al})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
    for (const n of nodes) { n.a *= 0.992; cx.fillStyle = `hsla(${n.hue},90%,80%,${n.a})`; cx.beginPath(); cx.arc(n.x, n.y, 2.2, 0, 6.28); cx.fill(); }
    // halkalar
    for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.r += 2.2; r.a *= 0.965; if (r.a < 0.02) { ripples.splice(i, 1); continue; }
      cx.strokeStyle = `hsla(${r.hue},85%,70%,${r.a})`; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, 6.28); cx.stroke(); }
    // kıvılcımlar
    cx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.a *= 0.96; if (p.a < 0.03) { sparks.splice(i, 1); continue; }
      cx.fillStyle = `hsla(${p.hue},95%,65%,${p.a})`; cx.beginPath(); cx.arc(p.x, p.y, 1.8, 0, 6.28); cx.fill(); }
    cx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }
  cx.fillStyle = '#0b0a1a'; cx.fillRect(0, 0, W, H);
  requestAnimationFrame(frame);

  // ---------- Dokunma ----------
  const last = new Map();
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const i = idxAt(e.clientY); last.set(e.pointerId, i); play(i, e.clientX); });
  cv.addEventListener('pointermove', e => {
    if (!last.has(e.pointerId)) return;
    const i = idxAt(e.clientY), prev = last.get(e.pointerId);
    if (i !== prev) { const dir = Math.sign(i - prev); for (let k = prev + dir; k !== i + dir; k += dir) play(k, e.clientX); last.set(e.pointerId, i); }
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, e => last.delete(e.pointerId)));

  // ---------- Kontroller ----------
  document.getElementById('go').addEventListener('click', () => {
    initAudio(); document.getElementById('start').hidden = true;
    [0, 2, 4, 7].forEach((i, k) => setTimeout(() => play(i, W * (0.3 + k * 0.13)), k * 180));
  });
  document.querySelectorAll('#makams button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#makams button').forEach(x => x.setAttribute('aria-pressed', x === b));
    mk = MAKAM[b.dataset.m]; document.getElementById('sub').textContent = mk.name;
    if (ac && droneNodes) drone(true);
    [0, 1, 2, 3, 4].forEach((i, k) => setTimeout(() => play(i, W * (0.2 + k * 0.15)), k * 140));
  }));

  // Seyir: makamın karar perdesine dönen, adım adım ilerleyen ezgi
  let autoT = null, pos = 7;
  const autoBtn = document.getElementById('auto');
  autoBtn.addEventListener('click', () => {
    const on = autoBtn.getAttribute('aria-pressed') !== 'true';
    autoBtn.setAttribute('aria-pressed', on); autoBtn.textContent = on ? 'Durdur' : 'Kendi kendine çalsın';
    if (!ac) { initAudio(); document.getElementById('start').hidden = true; }
    drone(on);
    clearTimeout(autoT);
    if (on) (function step() {
      const r = Math.random();
      pos += r < 0.42 ? -1 : r < 0.8 ? 1 : r < 0.9 ? -2 : 2;
      if (Math.random() < 0.12) pos += (7 - pos) > 0 ? 1 : -1; // karara çekim
      pos = Math.max(0, Math.min(STEPS - 1, pos));
      play(pos, W * (0.15 + Math.random() * 0.7));
      autoT = setTimeout(step, [220, 330, 330, 660][Math.floor(Math.random() * 4)]);
    })();
  });
})();
</script>
